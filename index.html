<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>圖片縮圖工具</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0d0d0f;
  --surface: #151518;
  --surface2: #1e1e23;
  --border: rgba(255,255,255,0.07);
  --accent: #c8ff00;
  --accent2: #ff6b35;
  --text: #f0f0f0;
  --muted: #666;
  --radius: 16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(200,255,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,255,0,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

.wrapper {
  position: relative;
  z-index: 1;
  max-width: 960px;
  margin: 0 auto;
  padding: 60px 24px 80px;
}

/* Header */
header {
  display: flex;
  align-items: flex-end;
  gap: 16px;
  margin-bottom: 56px;
}

.header-badge {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(200,255,0,0.08);
  border: 1px solid rgba(200,255,0,0.2);
  padding: 5px 12px;
  border-radius: 100px;
  margin-bottom: 6px;
}

h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.02em;
}

h1 em {
  font-style: normal;
  color: var(--accent);
}

.header-text { flex: 1; }

.header-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 20px var(--accent);
  margin-bottom: 12px;
  flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.7); }
}

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}

.card:hover { border-color: rgba(255,255,255,0.12); }

.card-label {
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* Upload zone */
#dropZone {
  border: 1.5px dashed rgba(200,255,0,0.25);
  border-radius: 12px;
  padding: 48px 32px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  background: rgba(200,255,0,0.02);
}

#dropZone:hover, #dropZone.dragover {
  border-color: var(--accent);
  background: rgba(200,255,0,0.05);
  transform: translateY(-1px);
}

#dropZone .icon {
  font-size: 36px;
  margin-bottom: 12px;
  display: block;
  opacity: 0.6;
}

#dropZone .drop-title {
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}

#dropZone .drop-sub {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

#imageInput { display: none; }

/* Success toast */
#status {
  position: fixed;
  bottom: 32px;
  right: 32px;
  background: var(--accent);
  color: #000;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  padding: 12px 20px;
  border-radius: 100px;
  display: none;
  align-items: center;
  gap: 8px;
  z-index: 100;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* File list */
#fileList {
  margin-top: 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.file-chip {
  font-size: 11px;
  padding: 4px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 100px;
  color: var(--muted);
  font-family: 'Syne', sans-serif;
}

/* Size rows */
#sizes { display: flex; flex-direction: column; gap: 10px; }

.size-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 10px;
  align-items: center;
}

.input-group {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.input-group:focus-within { border-color: rgba(200,255,0,0.4); }

.input-group label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 12px;
  font-family: 'Syne', sans-serif;
  white-space: nowrap;
}

.input-group input[type=number] {
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 600;
  width: 70px;
  padding: 10px 12px 10px 0;
}

input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }

.remove-btn {
  width: 32px; height: 32px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.15s;
}

.remove-btn:hover { background: rgba(255,80,80,0.1); color: #ff5050; }

/* Buttons row */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

button {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.05em;
  padding: 11px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.18s ease;
}

#addSizeBtn {
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}

#addSizeBtn:hover {
  background: var(--surface);
  color: var(--text);
  border-color: rgba(255,255,255,0.15);
}

#generateBtn {
  background: var(--accent);
  color: #000;
  flex: 1;
}

#generateBtn:hover {
  background: #d4ff1a;
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(200,255,0,0.25);
}

#generateBtn:active { transform: translateY(0); }

/* Preview */
#preview {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  min-height: 40px;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 12px;
  align-items: center;
}

.column-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--accent);
  background: rgba(200,255,0,0.08);
  padding: 4px 12px;
  border-radius: 100px;
}

.thumb-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  position: relative;
}

.thumb-box img {
  display: block;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--border);
  transition: border-color 0.2s;
  cursor: pointer;
}

.thumb-box img:hover {
  border-color: rgba(200,255,0,0.3);
}

.thumb-box .dim-label {
  font-size: 10px;
  color: var(--muted);
  font-family: 'Syne', sans-serif;
}

/* Empty state */
.empty-state {
  width: 100%;
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-size: 13px;
}

.empty-state .big { font-size: 32px; margin-bottom: 8px; opacity: 0.3; }

/* Notes */
.notes {
  margin-top: 32px;
  padding: 20px 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
}

.note-item {
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}

.note-item::before {
  content: '◆';
  color: var(--accent);
  font-size: 8px;
}

.by {
  margin-top: 40px;
  text-align: center;
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: rgba(255,255,255,0.1);
  text-transform: uppercase;
}
</style>
</head>
<body>

<div class="wrapper">

  <header>
    <div class="header-text">
      
      <h1>縮圖<em>預覽</em><br>小工具</h1>
    </div>
    <div class="header-dot"></div>
  </header>

  <!-- Upload -->
  <div class="card">
    <div class="card-label">01 — 上傳圖片</div>
    <input type="file" id="imageInput" multiple accept="image/jpeg,image/png,image/gif">
    <div id="dropZone">
      <span class="icon">⬆</span>
      <div class="drop-title">拖曳圖片到這裡</div>
      <div class="drop-sub">或點擊選擇 · 支援 JPG / PNG / GIF</div>
    </div>
    <div id="fileList"></div>
  </div>

  <!-- Sizes -->
  <div class="card">
    <div class="card-label">02 — 設定尺寸</div>
    <div id="sizes">
      <div class="size-row">
        <div class="input-group">
          <label>W</label>
          <input type="number" class="widthInput" value="20">
        </div>
        <div class="input-group">
          <label>H</label>
          <input type="number" class="heightInput" value="35">
        </div>
        <button class="remove-btn" title="刪除">×</button>
      </div>
      <div class="size-row">
        <div class="input-group">
          <label>W</label>
          <input type="number" class="widthInput" value="50">
        </div>
        <div class="input-group">
          <label>H</label>
          <input type="number" class="heightInput" value="50">
        </div>
        <button class="remove-btn" title="刪除">×</button>
      </div>
    </div>
    <div class="btn-row">
      <button id="addSizeBtn">＋ 新增尺寸</button>
      <button id="generateBtn">⚡ 生成縮圖</button>
    </div>
  </div>

  <!-- Preview -->
  <div class="card">
    <div class="card-label">03 — 預覽結果</div>
    <div id="preview">
      <div class="empty-state">
        <div class="big">🖼</div>
        上傳圖片並點擊「生成縮圖」後，結果會顯示在這裡
      </div>
    </div>
  </div>

  <div class="notes">
    <span class="note-item">僅支援 JPG / JPEG / PNG / GIF 格式</span>
    <span class="note-item">右鍵圖片可下載自訂尺寸之圖片</span>
    <span class="note-item">GIF僅供預覽使用下載後仍為原始尺寸</span>
  </div>

  <div class="by">By 性愛機器</div>

</div>

<!-- Toast -->
<div id="status">✦ 上傳成功</div>

<script>
const imageInput = document.getElementById('imageInput');
const dropZone   = document.getElementById('dropZone');
const status     = document.getElementById('status');
const preview    = document.getElementById('preview');
const sizesDiv   = document.getElementById('sizes');
const fileList   = document.getElementById('fileList');

let currentFiles = [];

function showSuccess() {
  status.style.display = 'flex';
  setTimeout(() => status.style.display = 'none', 2000);
}

function updateFileList(files) {
  fileList.innerHTML = '';
  Array.from(files).forEach(f => {
    const chip = document.createElement('div');
    chip.className = 'file-chip';
    chip.textContent = f.name;
    fileList.appendChild(chip);
  });
}

imageInput.addEventListener('change', e => {
  currentFiles = e.target.files;
  if (currentFiles.length) { showSuccess(); updateFileList(currentFiles); }
});

dropZone.addEventListener('click', () => imageInput.click());

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  currentFiles = e.dataTransfer.files;
  if (currentFiles.length) { showSuccess(); updateFileList(currentFiles); }
});

function addSizeRow(w = 50, h = 50) {
  const div = document.createElement('div');
  div.className = 'size-row';
  div.innerHTML = `
    <div class="input-group">
      <label>W</label>
      <input type="number" class="widthInput" value="${w}">
    </div>
    <div class="input-group">
      <label>H</label>
      <input type="number" class="heightInput" value="${h}">
    </div>
    <button class="remove-btn" title="刪除">×</button>
  `;
  div.querySelector('.remove-btn').addEventListener('click', () => div.remove());
  sizesDiv.appendChild(div);
}

// Bind existing remove buttons
document.querySelectorAll('.remove-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.closest('.size-row').remove());
});

document.getElementById('addSizeBtn').addEventListener('click', () => addSizeRow());

document.getElementById('generateBtn').addEventListener('click', () => {
  preview.innerHTML = '';

  if (!currentFiles.length) {
    preview.innerHTML = '<div class="empty-state"><div class="big">⚠</div>請先上傳圖片</div>';
    return;
  }

  const widths  = document.querySelectorAll('.widthInput');
  const heights = document.querySelectorAll('.heightInput');

  widths.forEach((wInput, i) => {
    const w = parseInt(wInput.value);
    const h = parseInt(heights[i].value);

    const column = document.createElement('div');
    column.className = 'column';

    const title = document.createElement('div');
    title.className = 'column-title';
    title.textContent = `${w} × ${h}`;
    column.appendChild(title);
    preview.appendChild(column);

    Array.from(currentFiles).forEach(file => {
      const reader = new FileReader();

      reader.onload = e => {
        const box = document.createElement('div');
        box.className = 'thumb-box';

        const label = document.createElement('div');
        label.className = 'dim-label';
        label.textContent = file.name.length > 16 ? file.name.slice(0, 14) + '…' : file.name;

        if (file.type === 'image/gif') {
          const gif = document.createElement('img');
          gif.src = e.target.result;
          gif.style.width = w + 'px';
          gif.style.height = h + 'px';
          gif.title = '右鍵另存圖片';
          box.appendChild(gif);
          box.appendChild(label);
          column.appendChild(box);
          return;
        }

        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          const ratio = Math.min(w / img.width, h / img.height);
          const nw = img.width * ratio;
          const nh = img.height * ratio;
          ctx.drawImage(img, (w - nw) / 2, (h - nh) / 2, nw, nh);

          const thumb = document.createElement('img');
          thumb.src = canvas.toDataURL('image/png');
          thumb.style.width  = w + 'px';
          thumb.style.height = h + 'px';
          thumb.title = '右鍵另存圖片';

          box.appendChild(thumb);
          box.appendChild(label);
          column.appendChild(box);
        };
        img.src = e.target.result;
      };

      reader.readAsDataURL(file);
    });
  });
});
</script>
</body>
</html>
