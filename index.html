<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>圖片預覽小工具</title>

<style>
body{
    margin:0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background:#f4f6f8;
    color:#333;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    text-align:center;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

#dropZone{
    border:2px dashed #bbb;
    border-radius:10px;
    padding:30px;
    text-align:center;
    background:#fafafa;
}

#status{
    text-align:center;
    color:#2ecc71;
    font-weight:bold;
    display:none;
}

#sizes{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.size-row{
    display:flex;
    gap:10px;
    align-items:center;
}

input[type=number]{
    width:80px;
    padding:6px;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#4a90e2;
    color:#fff;
}

/* 預覽 */
#preview{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.column{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.column-title{
    font-weight:bold;
    text-align:center;
}

.thumb-box{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.thumb-box img{
    display:block;
    object-fit:contain;
}
</style>
</head>

<body>

<div class="container">

<h1>圖片預覽小工具</h1>

<div class="card">

<input type="file" id="imageInput" multiple>
<div id="dropZone">拖曳圖片到這裡上傳</div>
<div id="status">上傳成功 ✔</div>

</div>

<div class="card">

<div id="sizes">

<div class="size-row">
寬：<input type="number" class="widthInput" value="20">
高：<input type="number" class="heightInput" value="35">
</div>

<div class="size-row">
寬：<input type="number" class="widthInput" value="50">
高：<input type="number" class="heightInput" value="50">
</div>

</div>

<button id="addSizeBtn">新增尺寸</button>
<button id="generateBtn">生成預覽圖</button>

</div>

<div class="card">
<div id="preview"></div>
</div>

</div>

<script>

const imageInput = document.getElementById('imageInput');
const dropZone = document.getElementById('dropZone');
const status = document.getElementById('status');
const preview = document.getElementById('preview');
const sizesDiv = document.getElementById('sizes');

let currentFiles = [];

function showSuccess(){
    status.style.display = 'block';
    setTimeout(()=> status.style.display='none',1500);
}

imageInput.addEventListener('change', e=>{
    currentFiles = e.target.files;
    if(currentFiles.length) showSuccess();
});

dropZone.addEventListener('dragover', e=>{
    e.preventDefault();
});

dropZone.addEventListener('drop', e=>{
    e.preventDefault();
    currentFiles = e.dataTransfer.files;
    imageInput.files = currentFiles;
    if(currentFiles.length) showSuccess();
});

document.getElementById('addSizeBtn').addEventListener('click', ()=>{
    const div = document.createElement('div');
    div.className='size-row';
    div.innerHTML=`
        寬：<input type="number" class="widthInput" value="50">
        高：<input type="number" class="heightInput" value="50">
    `;
    sizesDiv.appendChild(div);
});

document.getElementById('generateBtn').addEventListener('click', ()=>{

    preview.innerHTML='';

    const widths=document.querySelectorAll('.widthInput');
    const heights=document.querySelectorAll('.heightInput');

    widths.forEach((wInput,i)=>{

        const w=parseInt(wInput.value);
        const h=parseInt(heights[i].value);

        const column=document.createElement('div');
        column.className='column';

        const title=document.createElement('div');
        title.className='column-title';
        title.innerText=`${w} x ${h}`;

        column.appendChild(title);
        preview.appendChild(column);

        for(let file of currentFiles){

            const reader=new FileReader();

            reader.onload=e=>{

                const box=document.createElement('div');
                box.className='thumb-box';

              
                if(file.type==='image/gif'){

                    const gif=document.createElement('img');
                    gif.src=e.target.result;

                    gif.style.width=w+'px';
                    gif.style.height=h+'px';
                    gif.style.objectFit='contain';

                    box.appendChild(gif);
                    column.appendChild(box);

                    return;
                }

                /* PNG/JPG */
                const img=new Image();

                img.onload=()=>{

                    const canvas=document.createElement('canvas');
                    canvas.width=w;
                    canvas.height=h;

                    const ctx=canvas.getContext('2d');

                    const ratio=Math.min(w/img.width,h/img.height);

                    const nw=img.width*ratio;
                    const nh=img.height*ratio;

                    ctx.drawImage(img,(w-nw)/2,(h-nh)/2,nw,nh);

                    const url=canvas.toDataURL('image/png');

                    const thumb=document.createElement('img');
                    thumb.src=url;
                    thumb.style.width=w+'px';
                    thumb.style.height=h+'px';

                    box.appendChild(thumb);
                    column.appendChild(box);
                }

                img.src=e.target.result;
            }

            reader.readAsDataURL(file);
        }
    });

});

</script>

<div class="container">


<h3>只能使用JPG/JPEG/PNG/GIF檔上傳</h3>
<h3>可右鍵下載自訂尺寸之圖片(GIF下載後仍為原始尺寸，無法放大縮小)</h3>
<h3>By 性愛機器</h3>
</body>
</html>
