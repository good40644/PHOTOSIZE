<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>多尺寸縮圖預覽工具
圖片可右鍵下載縮圖後的尺寸，GIF檔不行</title>


<style>

body{
    font-family:Arial;
    padding:20px;
}

#controls{
    margin-bottom:20px;
}

.size-row{
    margin-bottom:10px;
}

.size-row input{
    width:70px;
    padding:5px;
}

#dropZone{
    border:2px dashed #aaa;
    padding:15px;
    margin-top:10px;
    text-align:center;
    color:#666;
}

#dropZone.dragover{
    border-color:#333;
    background:#f5f5f5;
}

#preview{
    display:flex;
    gap:30px;
    align-items:flex-start;
    margin-top:20px;
    flex-wrap:wrap;
}

.column{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.column-title{
    font-weight:bold;
    margin-bottom:10px;
}

.thumb-box{
    border:1px solid #ccc;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#fff;
}

.thumb-box img{
    max-width:100%;
    max-height:100%;
}

button{
    padding:6px 10px;
    cursor:pointer;
}

</style>
</head>

<body>

<h1>多尺寸縮圖預覽工具</h1>
<h2>圖片可右鍵下載縮圖後的尺寸，GIF檔不行</h2>

<div id="controls">

<input type="file" id="imageInput" multiple>

<div id="dropZone">
👉 可拖曳圖片到這裡(可多圖)
</div>

<br>

<div id="sizes">

<div class="size-row">
寬：<input type="number" class="widthInput" value="50">
高：<input type="number" class="heightInput" value="50">
</div>

<div class="size-row">
寬：<input type="number" class="widthInput" value="20">
高：<input type="number" class="heightInput" value="35">
</div>

</div>

<br>

<button id="addSizeBtn">新增尺寸欄位</button>
<button id="generateBtn">生成縮圖預覽</button>

</div>

<div id="preview"></div>

<script>

const imageInput = document.getElementById('imageInput');
const preview = document.getElementById('preview');
const generateBtn = document.getElementById('generateBtn');
const addSizeBtn = document.getElementById('addSizeBtn');
const sizesDiv = document.getElementById('sizes');
const dropZone = document.getElementById('dropZone');

let currentFiles = [];

// 點選上傳
imageInput.addEventListener('change', function(){
    currentFiles = this.files;
});

// 拖曳效果
dropZone.addEventListener('dragover', function(e){
    e.preventDefault();
    dropZone.classList.add('dragover');
});

dropZone.addEventListener('dragleave', function(){
    dropZone.classList.remove('dragover');
});

// 拖曳放入
dropZone.addEventListener('drop', function(e){
    e.preventDefault();
    dropZone.classList.remove('dragover');

    currentFiles = e.dataTransfer.files;

    // 同步給 input（方便使用）
    imageInput.files = currentFiles;
});

// 新增尺寸欄位
addSizeBtn.addEventListener('click', function(){

    const row = document.createElement('div');
    row.className = 'size-row';

    row.innerHTML = `
        寬：<input type="number" class="widthInput" value="50">
        高：<input type="number" class="heightInput" value="50">
    `;

    sizesDiv.appendChild(row);
});

// 生成縮圖
generateBtn.addEventListener('click', function(){

    preview.innerHTML = '';

    const files = currentFiles;

    if(!files || files.length === 0){
        alert('請先選擇或拖曳圖片');
        return;
    }

    const widthInputs = document.querySelectorAll('.widthInput');
    const heightInputs = document.querySelectorAll('.heightInput');

    widthInputs.forEach((wInput, index)=>{

        const targetW = parseInt(wInput.value);
        const targetH = parseInt(heightInputs[index].value);

        const column = document.createElement('div');
        column.className = 'column';

        const title = document.createElement('div');
        title.className = 'column-title';
        title.innerText = `${targetW} x ${targetH}`;

        column.appendChild(title);
        preview.appendChild(column);

        for(let file of files){

            // GIF
            if(file.type === 'image/gif'){

                const reader = new FileReader();

                reader.onload = function(e){

                    const box = createBox(targetW, targetH);
                    const img = document.createElement('img');

                    img.src = e.target.result;

                    box.appendChild(img);
                    column.appendChild(box);
                }

                reader.readAsDataURL(file);
                continue;
            }

            // JPG / PNG
            const reader = new FileReader();

            reader.onload = function(e){

                const img = new Image();

                img.onload = function(){

                    const canvas = document.createElement('canvas');
                    canvas.width = targetW;
                    canvas.height = targetH;

                    const ctx = canvas.getContext('2d');

                    const ratio = Math.min(
                        targetW / img.width,
                        targetH / img.height
                    );

                    const w = img.width * ratio;
                    const h = img.height * ratio;

                    const x = (targetW - w) / 2;
                    const y = (targetH - h) / 2;

                    ctx.drawImage(img, x, y, w, h);

                    const url = canvas.toDataURL('image/png');

                    const box = createBox(targetW, targetH);
                    const thumb = document.createElement('img');

                    thumb.src = url;

                    box.appendChild(thumb);
                    column.appendChild(box);
                }

                img.src = e.target.result;
            }

            reader.readAsDataURL(file);
        }
    });

});

// 建立外框
function createBox(w, h){
    const box = document.createElement('div');
    box.className = 'thumb-box';
    box.style.width = w + 'px';
    box.style.height = h + 'px';
    return box;
}

</script>

</body>
</html>
